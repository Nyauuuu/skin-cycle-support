<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkinCycle - 技术支持</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: #FAF4ED;
      color: #2C2C2C;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(178, 84, 90, 0.08);
    }
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #B2545A, #D4847C);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      font-size: 28px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #888;
      font-size: 15px;
      margin-bottom: 32px;
    }
    .version {
      display: inline-block;
      background: #F5F0EB;
      color: #B2545A;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 32px;
    }
    hr {
      border: none;
      border-top: 1px solid #F0EBE6;
      margin: 32px 0;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      line-height: 1.7;
      color: #555;
      margin-bottom: 16px;
    }
    .email {
      display: inline-block;
      background: #B2545A;
      color: white;
      font-size: 15px;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 100px;
      text-decoration: none;
      margin-top: 8px;
    }
    .disclaimer {
      background: #F9F5F2;
      border-left: 3px solid #B2545A;
      padding: 16px 20px;
      border-radius: 0 12px 12px 0;
      margin-top: 32px;
    }
    .disclaimer-title {
      font-size: 13px;
      font-weight: 600;
      color: #B2545A;
      margin-bottom: 6px;
    }
    .disclaimer p {
      font-size: 13px;
      color: #888;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🌿</div>
    <h1>SkinCycle</h1>
    <p class="subtitle">护肤日记 · 周期追踪</p>
    <span class="version">Version 1.0</span>

    <hr>

    <h2>联系我们</h2>
    <p>如遇问题或建议，欢迎通过以下方式联系我们：</p>
    <p>我们会尽快回复。</p>
    <a class="email" href="mailto:support@skincycle.app">联系支持团队</a>

    <div class="disclaimer">
      <div class="disclaimer-title">⚠️ 免责声明</div>
      <p>本应用不构成医疗建议。皮肤问题、妇科健康问题请咨询专业医生。本应用仅供记录和参考，不能替代专业医疗诊断。</p>
    </div>
  </div>
</body>
</html>
